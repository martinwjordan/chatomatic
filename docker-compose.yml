services:
  chatomatic:
    build: .
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /share/homes/admin/chatomatic/data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
